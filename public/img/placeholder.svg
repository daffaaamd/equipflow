<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071424"/>
      <stop offset="50%" stop-color="#0B2341"/>
      <stop offset="100%" stop-color="#0F2E52"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2636"/>
      <stop offset="100%" stop-color="#0D1622"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <pattern id="diagGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#skyGrad)"/>
  <rect width="1200" height="800" fill="url(#diagGrid)"/>

  <!-- Construction Site Ground / Hill Horizon -->
  <path d="M 0 540 Q 300 500 600 530 T 1200 520 L 1200 800 L 0 800 Z" fill="url(#groundGrad)"/>
  <path d="M 0 580 Q 400 560 800 590 L 1200 570 L 1200 800 L 0 800 Z" fill="#0A121C"/>

  <!-- Detailed Heavy Excavator Silhouette & Geometry in Center -->
  <g transform="translate(480, 270)">
    <!-- Glow behind machine -->
    <circle cx="120" cy="180" r="160" fill="#F97316" opacity="0.12" filter="blur(30px)"/>

    <!-- Track Undercarriage -->
    <rect x="-80" y="240" width="340" height="48" rx="24" fill="#1e293b" stroke="#334155" stroke-width="3"/>
    <!-- Track Rollers -->
    <circle cx="-50" cy="264" r="14" fill="#0f172a"/>
    <circle cx="0" cy="264" r="14" fill="#0f172a"/>
    <circle cx="50" cy="264" r="14" fill="#0f172a"/>
    <circle cx="100" cy="264" r="14" fill="#0f172a"/>
    <circle cx="150" cy="264" r="14" fill="#0f172a"/>
    <circle cx="200" cy="264" r="14" fill="#0f172a"/>
    <circle cx="230" cy="264" r="14" fill="#0f172a"/>

    <!-- Main Rotating Body / Counterweight -->
    <path d="M -70 240 L -70 150 Q -70 120 -30 115 L 140 115 L 170 170 L 170 240 Z" fill="url(#accentGrad)"/>
    <!-- Counterweight shadow block -->
    <path d="M -70 240 L -70 150 Q -70 120 -30 115 L 20 115 L 0 240 Z" fill="#ea580c" opacity="0.6"/>

    <!-- Operator Cabin -->
    <path d="M 40 170 L 40 100 L 125 100 L 140 170 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="52" y="110" width="68" height="48" rx="4" fill="#38bdf8" opacity="0.3"/>

    <!-- Boom & Arm -->
    <path d="M 120 170 L 250 20 L 270 30 L 145 190 Z" fill="url(#accentGrad)"/>
    <circle cx="260" cy="25" r="12" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
    <path d="M 260 25 L 390 140 L 375 155 L 248 40 Z" fill="#f59e0b"/>

    <!-- Hydraulic Cylinder -->
    <path d="M 160 140 L 290 80" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>

    <!-- Bucket -->
    <path d="M 390 140 Q 430 160 410 210 Q 380 230 350 200 Q 360 160 390 140 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
    <!-- Bucket teeth -->
    <polygon points="410,210 425,230 405,225" fill="#f59e0b"/>
    <polygon points="395,220 405,240 390,232" fill="#f59e0b"/>
    <polygon points="378,228 385,248 372,238" fill="#f59e0b"/>
  </g>

  <!-- Branding Badge -->
  <g transform="translate(600, 670)">
    <rect x="-180" y="-35" width="360" height="70" rx="35" fill="#0f172a" fill-opacity="0.85" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="3" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="3">EQUIP<tspan fill="#f59e0b">FLOW</tspan></text>
    <text x="0" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="4">HEAVY EQUIPMENT FLEET</text>
  </g>
</svg>
